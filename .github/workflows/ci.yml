name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # The declared compatibility baseline. The differential suite is only
  # meaningful against this exact version: the runner image's own jq is older
  # (it answers `builtins|length` = 218 where 1.8.1 answers 226, and has no
  # `trimstr`), so comparing against it produces failures that say nothing about
  # this shim.
  JQ_BASELINE: "1.8.1"
  JAQ_VERSION: "3.1.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the engine crates
        # jaq's own tests, carried with the import (crates/UPSTREAM.md); they
        # need neither jq nor jaq. mimalloc's C build can make the linker
        # print a note (rustc's `linker_messages`), which is not a finding.
        env:
          RUSTFLAGS: "-D warnings -A linker_messages"
        run: cargo test --workspace --exclude pathfinder-jq

  # The shim's suites on every engine (PRD R-014), each held to its own
  # conformance ratchet: `native` (the engine crates in process,
  # FLOOR-native), `jaq-patched` (`pathfinder-jaq`, the CLI on the same
  # crates, standing in for the packaged patched jaq, FLOOR-patched) and
  # `jaq-stock` (the pinned upstream jaq, FLOOR).
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [native, jaq-patched, jaq-stock]
    env:
      # The shim links mimalloc, whose C build can make the linker print a
      # note (rustc's `linker_messages`), which is not a finding.
      RUSTFLAGS: "-D warnings -A linker_messages"
    steps:
      - uses: actions/checkout@v4

      - name: Install the baseline jq
        run: |
          set -euo pipefail
          url="https://github.com/jqlang/jq/releases/download/jq-${JQ_BASELINE}/jq-linux-amd64"
          curl -fsSL "$url" -o /tmp/jq
          # Official checksum from jqlang/jq's sha256sum.txt for jq-1.8.1.
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  /tmp/jq" | sha256sum -c -
          chmod +x /tmp/jq
          test "$(/tmp/jq --version)" = "jq-${JQ_BASELINE}"

      - name: Select the engine
        run: |
          set -euo pipefail
          case "${{ matrix.engine }}" in
            native)
              echo "PATHFINDER_ENGINE=native" >> "$GITHUB_ENV" ;;
            jaq-patched)
              cargo build --release -p pathfinder-jaq
              echo "PATHFINDER_ENGINE=jaq" >> "$GITHUB_ENV"
              echo "PATHFINDER_JAQ=$PWD/target/release/pathfinder-jaq" >> "$GITHUB_ENV" ;;
            jaq-stock)
              # Pinned for the same reason as jq: the differential results
              # describe a specific engine, and an unpinned upgrade would
              # silently change what the suite is asserting.
              cargo install jaq --locked --version "${JAQ_VERSION}"
              echo "PATHFINDER_ENGINE=jaq" >> "$GITHUB_ENV"
              echo "PATHFINDER_JAQ=$HOME/.cargo/bin/jaq" >> "$GITHUB_ENV" ;;
          esac

      - name: Test against the baseline jq
        env:
          PATHFINDER_REAL_JQ: /tmp/jq
          # Turn "no usable jq" from a silent skip into a hard failure: a green
          # tick that skipped the compatibility contract is worse than a red one.
          PATHFINDER_REQUIRE_JQ: "1"
          # Same for jaq: the conformance suite must run, never skip.
          PATHFINDER_REQUIRE_JAQ: "1"
        run: cargo test -- --nocapture

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
