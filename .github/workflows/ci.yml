name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # jq is installed here so the differential suite actually runs rather than
      # skipping; a green tick that skipped the compatibility contract would be
      # worse than no tick at all.
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: cargo install jaq --locked
      - name: Test against real jq
        env:
          PATHFINDER_REAL_JQ: /usr/bin/jq
        run: cargo test -- --nocapture

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
