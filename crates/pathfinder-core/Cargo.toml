[package]
name = "pathfinder-core"
version = "3.1.0"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
readme = "../../README.md"
description = "Interpreter for the jaq language"
repository = "https://github.com/01mf02/jaq"
keywords = ["json", "query", "jq"]
categories = ["parser-implementations", "compilers"]
# Pathfinder: 1.81, not jaq's 1.69: the crate-level `#![expect]`/`#![allow]`
# with `reason` that T-006 added need it.
rust-version = "1.81"

# Pathfinder: the package is renamed, the library keeps its upstream name so
# the imported sources compile unchanged (crates/UPSTREAM.md).
[lib]
name = "jaq_core"

[features]
default = ["std"]
std = []

[dependencies]
arbitrary = { version = "1.4", optional = true }
dyn-clone = "1.0"
once_cell = "1.16.0"
typed-arena = "2.0.2"

[dev-dependencies]
jaq-std  = { package = "pathfinder-std", path = "../pathfinder-std" }
jaq-json = { package = "pathfinder-json", path = "../pathfinder-json", features = ["serde"] }
serde_json = "1.0"

# Pathfinder (TODO T-006): the workspace lint set, `unsafe_code = "forbid"`
# included.
[lints]
workspace = true
