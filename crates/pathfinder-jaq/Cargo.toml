[package]
name = "pathfinder-jaq"
version = "3.1.1"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
readme = "../../README.md"
description = "jaq's command line on Pathfinder's engine crates: the driver the `pathfinder` binary runs in process"
repository = "https://github.com/01mf02/jaq"
keywords = ["json", "query", "jq"]
categories = ["command-line-utilities"]
# Pathfinder: 1.82, not jaq's 1.70, as `pathfinder-json` needs.
rust-version = "1.82"
# Pathfinder: a library for the `pathfinder` binary; never installed or
# published. Its binary target went with the jaq engine (P-078).
publish = false

# Pathfinder (M19): jaq's `jaq` CLI crate. Its library, `jaq`, is the driver
# the `pathfinder` binary evaluates with in process:
# run options, input readers, output writer and exit status. `jaq-all` is a
# package of its own, `pathfinder-all`, so that this one can be a library.
[lib]
name = "jaq"
path = "src/lib.rs"

# Pathfinder (TODO T-004): `jaq-all`'s `formats` feature went with the
# non-jq formats.
[features]

[dependencies]
# Pathfinder: the engine crates are reached through `jaq-all`, as the CLI's
# sources reach them.
jaq-all  = { workspace = true }

# jaq. Pathfinder (TODO T-004): `rustyline` and `dirs` (the REPL) and
# `tempfile` (`--in-place`) are gone.
env_logger = { version = "0.10.0", default-features = false }
log = { version = "0.4.17" }

# Pathfinder (TODO T-006): the workspace lint set, `unsafe_code = "forbid"`
# included.
[lints]
workspace = true
