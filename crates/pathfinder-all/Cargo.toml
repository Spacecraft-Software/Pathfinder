[package]
name = "pathfinder-all"
version = "0.3.0"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
readme = "../../README.md"
description = "jaq-all on Pathfinder's engine crates: compile and run jq filters, read and write data"
repository = "https://github.com/01mf02/jaq"
keywords = ["json", "query", "jq"]
categories = ["parser-implementations"]
# Pathfinder: 1.82, not jaq's 1.70, as `pathfinder-json` needs.
rust-version = "1.82"
publish = false

# Pathfinder (M19): jaq's `jaq-all` crate, split out of `pathfinder-jaq` so
# that the CLI crate can be a library the `pathfinder` binary links. The
# library keeps the name `jaq_all`, so its sources and the CLI's compile as
# upstream (plus the patch set) wrote them (crates/UPSTREAM.md).
[lib]
name = "jaq_all"
path = "src/lib.rs"

# Pathfinder (TODO T-004): the `formats` feature went with the non-jq formats.
[features]
default = ["std-all"]
std-all = ["jaq-std/default"]

[dependencies]
jaq-core = { workspace = true }
jaq-std  = { workspace = true }
jaq-json = { workspace = true }
jaq-fmts = { workspace = true }

codesnake = { version = "0.3" }
unicode-width = "0.1.13"

# Pathfinder (TODO T-006): the workspace lint set, `unsafe_code = "forbid"`
# included.
[lints]
workspace = true
