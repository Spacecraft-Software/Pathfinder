[package]
name = "pathfinder-std"
version = "3.0.1"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT AND LGPL-2.1-or-later"
readme = "../../README.md"
description = "Standard library for jaq"
repository = "https://github.com/01mf02/jaq"
keywords = ["json", "query", "jq"]
# Pathfinder: the workspace lints (`clippy::cargo`) require categories.
categories = ["compilers"]
# Pathfinder: 1.81, not jaq's 1.70: the crate-level `#![expect]`/`#![allow]`
# with `reason` that T-006 added need it.
rust-version = "1.81"

# Pathfinder: the package is renamed, the library keeps its upstream name so
# the imported sources compile unchanged (crates/UPSTREAM.md).
[lib]
name = "jaq_std"

[features]
default = ["std", "format", "log", "math", "regex", "time"]
regex = ["pathfinder-regex", "std"]
std = ["jaq-core/std"]
format = ["aho-corasick", "base64", "urlencoding"]
math = ["libm"]
time = ["jiff", "std"]

[dependencies]
jaq-core = { workspace = true }

bstr = "1"
jiff = { version = "0.2.15", optional = true }
# Pathfinder (PLAN P-071): Oniguruma 6.9.10 as jq 1.8.1 runs it.
pathfinder-regex = { path = "../pathfinder-regex", optional = true }
log = { version = "0.4.17", optional = true }
libm = { version = "0.2.7", optional = true }
aho-corasick = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1.3", optional = true }

[dev-dependencies]
jaq-json = { package = "pathfinder-json", path = "../pathfinder-json", features = ["serde"] }
serde_json = "1.0"

# Pathfinder (TODO T-006): the workspace lint set, `unsafe_code = "forbid"`
# included.
[lints]
workspace = true
